# ============================================================================
# 大模型服务层配置（示例模板，复制为 application.yml 后填入实际值）
# ============================================================================

server:
  port: 9090    # HTTP 端口（健康检查、管理接口）

spring:
  application:
    name: llm-service

  # MySQL 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/intelligent_cs?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: <your-username>
    password: <your-password>
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# gRPC 服务端配置
grpc:
  server:
    port: 50051              # gRPC 服务端口
    enable-keep-alive: true
    keep-alive-time: 30s
    keep-alive-timeout: 10s
    permit-keep-alive-without-calls: true

  # gRPC 客户端配置（调用调度服务）
  client:
    dispatcher-service:
      address: static://localhost:50052
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      keep-alive-timeout: 10s

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================================
# Prompt 提示词配置（留空则使用内置默认值）
# ============================================================================
prompt:
  direct-answer: >
    你是一个专业、友好的智能客服助手。请根据对话历史和知识库信息，为用户提供准确、有帮助的回答。
    如果不确定答案，请诚实告知并建议用户转人工客服。回答应简洁、口语化。
  corpus-generation: >
    你是一个专业的智能客服训练语料生成助手。你的任务是根据给定的用户对话上下文和知识库参考内容，生成高质量的问答训练语料。

    生成要求：
    1. 围绕用户对话涉及的主题，拓展生成多种不同表述方式的问答对
    2. 问题应涵盖用户可能的不同提问方式（口语化、正式化、简短化等）
    3. 答案应准确、完整、口语化，适合客服场景使用
    4. 每条语料附带用户意图识别标签和置信度评分(0.0-1.0)
    5. 确保生成内容与知识库内容一致，不要编造不存在的信息

    输出格式（严格JSON数组）：
    [
      {"question": "...", "answer": "...", "intent": "...", "confidence": 0.9},
      ...
    ]

# ============================================================================
# LLM API 配置
# ============================================================================
llm:
  api:
    # OpenAI 兼容接口配置（适用于 GPT、通义千问等）
    base-url: https://api.siliconflow.cn/v1
    api-key: <your-api-key>
    model: Qwen/Qwen2.5-72B-Instruct
    timeout: 60
    max-retries: 3
  # 默认生成参数
  default-config:
    temperature: 0.7
    max-tokens: 2048
    top-p: 0.9

# ============================================================================
# 语料生成配置
# ============================================================================
corpus:
  generation:
    default-count: 5          # 默认生成语料条数
    max-count: 20             # 单次最大生成条数
    min-confidence: 0.6       # 最低置信度阈值

# ============================================================================
# 阿里云 OSS 配置
# ============================================================================
aliyun:
  oss:
    endpoint: oss-cn-shanghai.aliyuncs.com
    access-key-id: <your-access-key-id>
    access-key-secret: <your-access-key-secret>
    bucket-name: slm-corpus
    dir-prefix: corpus/raw/

# ============================================================================
# FAQ 检索配置
# ============================================================================
faq:
  search:
    max-results: 5            # RAG 检索最大返回条数
    min-score: 0.3            # 最低相似度分数
    vector-enabled: true      # 是否启用向量语义检索 (false 时降级为 MySQL 全文检索)
  sync:
    interval: 300000          # 定时同步间隔 (毫秒), 默认5分钟
    initial-delay: 60000      # 启动后延迟 (毫秒), 默认60秒
    batch-size: 50            # 每次同步最大条数

# ============================================================================
# 向量数据库配置 (Qdrant)
# ============================================================================
qdrant:
  host: localhost
  port: 6334                  # Qdrant gRPC 端口
  collection-name: faq_knowledge_vectors  # FAQ 向量集合名称

# ============================================================================
# Embedding 向量化配置 (阿里云 DashScope)
# ============================================================================
embedding:
  api-key: <your-dashscope-api-key>  # DashScope API Key
  url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding
  model: qwen3-vl-embedding    # Embedding 模型
  dimensions: 1024            # 向量维度

# 日志配置
logging:
  level:
    com.ics.llm: DEBUG
    io.grpc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
