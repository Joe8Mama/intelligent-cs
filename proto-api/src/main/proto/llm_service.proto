// ============================================================================
// 大模型服务层 - gRPC 接口定义
// 包含: LLM接入服务、语料生成服务
// ============================================================================
syntax = "proto3";

package com.ics.llm.grpc;

option java_multiple_files = true;
option java_package = "com.ics.llm.grpc.proto";
option java_outer_classname = "LlmServiceProto";

import "google/protobuf/timestamp.proto";

// ============================================================================
// 一、LLM 接入模块 - 统一大模型调用接口
// 封装底层 LLM API，对外提供标准化的 gRPC 调用入口
// ============================================================================
service LlmService {
    // 单轮对话：接收用户输入，返回大模型生成的回答
    rpc Chat(ChatRequest) returns (ChatResponse);

    // 批量对话：支持一次传入多条消息，批量获取回答（用于语料生成等场景）
    rpc BatchChat(BatchChatRequest) returns (BatchChatResponse);

    // 流式对话：大模型流式输出回答（用于前端实时展示）
    rpc StreamChat(ChatRequest) returns (stream ChatStreamResponse);
}

// ============================================================================
// 二、语料生成模块 - 基于对话数据 + RAG 生成训练语料
// 接收调度模块传递的对话上下文，结合 FAQ 知识库检索结果，
// 生成高质量问答语料并存入小模型语料库
// ============================================================================
service CorpusGenerationService {
    // 生成语料：接收对话数据，生成多条问答语料并入库
    // 入库完成后通过 DispatcherService.OnCorpusReady 通知调度模块
    rpc GenerateCorpus(CorpusGenerationRequest) returns (CorpusGenerationResponse);
}

// ============================================================================
// 消息定义 - LLM 接入模块
// ============================================================================

// 对话消息体：表示一轮对话中的单条消息
message ChatMessage {
    string role = 1;            // 角色: "user" / "assistant" / "system"
    string content = 2;         // 消息内容
    google.protobuf.Timestamp timestamp = 3;  // 消息时间戳
}

// 单轮对话请求
message ChatRequest {
    string request_id = 1;               // 请求唯一标识（用于幂等性校验和链路追踪）
    string session_id = 2;               // 会话ID（关联完整对话上下文）
    string user_id = 3;                  // 用户ID
    repeated ChatMessage messages = 4;   // 对话历史（含本次用户输入）
    ChatConfig config = 5;               // 模型调用配置
}

// 模型调用配置
message ChatConfig {
    string model_name = 1;      // 模型名称，如 "gpt-4", "qwen-max"
    float temperature = 2;      // 温度参数，控制生成随机性 (0.0-2.0)
    int32 max_tokens = 3;       // 最大输出token数
    float top_p = 4;            // Top-P 采样参数
    string system_prompt = 5;   // 系统提示词（可覆盖默认prompt）
}

// 单轮对话响应
message ChatResponse {
    string request_id = 1;       // 请求唯一标识（与请求对应）
    int32 code = 2;              // 状态码: 0=成功, 非0=失败
    string message = 3;          // 状态描述
    string answer = 4;           // 大模型生成的回答
    UsageInfo usage = 5;         // Token 消耗统计
}

// Token 消耗统计
message UsageInfo {
    int32 prompt_tokens = 1;      // 输入 token 数
    int32 completion_tokens = 2;  // 输出 token 数
    int32 total_tokens = 3;       // 总 token 数
}

// 批量对话请求
message BatchChatRequest {
    string batch_id = 1;                     // 批次唯一标识
    repeated ChatRequest requests = 2;       // 多个对话请求
}

// 批量对话响应
message BatchChatResponse {
    string batch_id = 1;                     // 批次唯一标识
    int32 code = 2;                          // 整体状态码
    string message = 3;                      // 整体状态描述
    repeated ChatResponse responses = 4;     // 各请求的响应
}

// 流式对话响应（逐 chunk 返回）
message ChatStreamResponse {
    string request_id = 1;       // 请求唯一标识
    string delta_content = 2;    // 增量内容片段
    bool is_finished = 3;        // 是否为最后一个 chunk
    UsageInfo usage = 4;         // 最后一个 chunk 携带 usage 信息
}

// ============================================================================
// 消息定义 - 语料生成模块
// ============================================================================

// 语料生成请求
message CorpusGenerationRequest {
    string task_id = 1;                      // 任务唯一标识（用于幂等性校验）
    string session_id = 2;                   // 原始会话ID
    string user_id = 3;                      // 用户ID
    repeated ChatMessage dialog_context = 4; // 本次完整对话上下文
    TriggerType trigger_type = 5;            // 触发类型
    int32 corpus_count = 6;                  // 期望生成的语料条数（默认5）
    string callback_address = 7;             // 完成后的回调地址（调度服务地址）
}

// 触发类型枚举
enum TriggerType {
    TRIGGER_TYPE_UNKNOWN = 0;          // 未知
    INTENT_RECOGNITION_FAILED = 1;     // 小模型意图识别失败
    USER_NEGATIVE_FEEDBACK = 2;        // 用户反馈不佳
}

// 语料生成响应（同步返回任务接收状态，实际生成是异步的）
message CorpusGenerationResponse {
    string task_id = 1;          // 任务唯一标识
    int32 code = 2;              // 状态码: 0=任务已接收, 非0=拒绝
    string message = 3;          // 状态描述
}

// 单条生成的语料
message GeneratedCorpusItem {
    string corpus_id = 1;        // 语料唯一ID
    string question = 2;         // 问题
    string answer = 3;           // 答案
    string category = 4;         // 语料分类
    float confidence = 5;        // 生成置信度 (0.0-1.0)
    string source_session_id = 6; // 来源会话ID
}
