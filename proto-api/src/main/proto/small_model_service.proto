// ============================================================================
// 小模型服务层 - gRPC 接口定义（接口约定）
// 说明: 此 proto 仅定义调度层需要调用的小模型训练接口，
//       小模型服务层的完整实现不在本项目范围内
// ============================================================================
syntax = "proto3";

package com.ics.smallmodel.grpc;

option java_multiple_files = true;
option java_package = "com.ics.smallmodel.grpc.proto";
option java_outer_classname = "SmallModelServiceProto";

import "google/protobuf/timestamp.proto";

// ============================================================================
// 小模型训练服务 - 供调度模块调用
// ============================================================================
service SmallModelTrainingService {
    // 触发小模型增量训练
    // 调度模块在语料入库完成后调用此接口
    rpc StartTraining(TrainingRequest) returns (TrainingResponse);

    // 查询训练状态
    rpc QueryTrainingStatus(TrainingStatusRequest) returns (TrainingStatusResponse);
}

// 训练请求
message TrainingRequest {
    string training_task_id = 1;         // 训练任务ID（幂等键）
    string source_task_id = 2;           // 来源任务ID（关联调度任务）
    string dataset_uri = 3;              // 数据集 URI (如 oss://corpus/raw/batch_xxx.jsonl)
    TrainingType training_type = 4;      // 训练类型
    TrainingConfig config = 5;           // 训练配置
}

// 训练类型
enum TrainingType {
    TRAINING_TYPE_UNKNOWN = 0;
    INCREMENTAL = 1;           // 增量训练
    FULL = 2;                  // 全量训练
}

// 训练配置
message TrainingConfig {
    int32 epochs = 1;           // 训练轮次
    float learning_rate = 2;    // 学习率
    int32 batch_size = 3;       // 批大小
}

// 训练响应
message TrainingResponse {
    string training_task_id = 1;
    int32 code = 2;              // 0=已接收, 非0=拒绝
    string message = 3;
}

// 训练状态查询请求
message TrainingStatusRequest {
    string training_task_id = 1;
}

// 训练状态查询响应
message TrainingStatusResponse {
    string training_task_id = 1;
    string status = 2;           // "pending" / "running" / "completed" / "failed"
    float progress = 3;          // 进度 (0.0-1.0)
    string message = 4;
}
